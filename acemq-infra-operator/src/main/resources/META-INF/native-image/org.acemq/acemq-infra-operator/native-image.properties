# Read by native-image from the jar, so the image is configured by what it is
# built from and Dockerfile.native carries no list of its own.
#
# --enable-url-protocols, which acemq-infra-native leaves out because the CLI
# only ever builds java.net.URI: fabric8 builds a java.net.URL from the API
# server's address when the client starts, and without this the native
# operator dies there with "The URL protocol https is supported but not
# enabled by default". Found by the first native run on kind.
Args = --features=org.acemq.infra.operator.NativeImageFeature \
       --enable-url-protocols=http,https
