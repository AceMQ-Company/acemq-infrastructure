# Build the documentation site and publish it to GitHub Pages.
#
# The site is the markdown under docs/ rendered to HTML. There is no generated
# API reference to fold in, because there is no API yet -- see docs/roadmap.md.
# When there is, the javadoc goes under site/apidocs/ and the build script gains
# a step, the way acemq-java-rabbitmq-admin does it.
#
# Both link checks live in the build script rather than here, so that a local
# run and a CI run cannot disagree about what passes. ci.yml runs the same
# script on every pull request; this workflow is only about deploying what it
# produced.
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - '.github/scripts/build-docs-site.sh'
  workflow_dispatch:

# One deployment at a time; a queued run supersedes a waiting one rather than
# racing it. In-progress runs are allowed to finish so a half-published site is
# never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        # From the GitHub release rather than apt: the 27 MB pandoc .deb from
        # the Azure Ubuntu mirror crawled at ~50 kB/s and held this step for
        # 6-10 minutes, twice, on 2026-10-22. 3.1.3 is the version noble's apt
        # shipped, so the rendered pages are unchanged. The checksum pins the
        # bytes; the timeouts turn a slow download into a fast failure.
        timeout-minutes: 3
        run: |
          curl -fsSL --retry 3 --max-time 120 -o "$RUNNER_TEMP/pandoc.tgz" \
            https://github.com/jgm/pandoc/releases/download/3.1.3/pandoc-3.1.3-linux-amd64.tar.gz
          echo "74bc434908e4d858b3edbfd6271d2e9e499477837e5df1d630df4e62f113803d  $RUNNER_TEMP/pandoc.tgz" | sha256sum -c -
          sudo tar xzf "$RUNNER_TEMP/pandoc.tgz" --strip-components 1 -C /usr/local
          pandoc --version | head -1

      # Renders, and fails on a dead link or a dangling anchor at either end:
      # over docs/*.md before rendering, because cross-page links are written as
      # .md so the pages read correctly on GitHub and a site-only check cannot
      # see that half; and over site/*.html afterwards, because a renamed
      # heading silently moves its id and leaves every link to it pointing at
      # the top of the page.
      - name: Render the pages and check every link and anchor
        run: bash .github/scripts/build-docs-site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # A job's own block replaces the workflow default rather than adding to it,
    # so contents is repeated here. This is GitHub's own deploy-pages triple.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
