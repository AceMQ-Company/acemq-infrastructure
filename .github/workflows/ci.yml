# Four things can break here, and CI checks all four.
#
#   * the shell and Python scripts parse, and shellcheck is happy with them;
#   * the four Java modules build and their tests pass -- the configuration
#     model, the validator and the planner in core; probe() against a broker in
#     the provider; the executor, its guards and a cutover-then-rollback against
#     two brokers in execute; validate, plan and apply in the CLI over them;
#   * every example validates against the documented format;
#   * every file in examples/rejected/ is REJECTED. That last assertion is the
#     one that matters. A linter whose rules have quietly stopped firing passes
#     everything, including the files that describe the mistakes it exists to
#     catch, and looks exactly like a linter that works.
#
# The last two run twice over, once against scripts/lint-deployment.py and once
# against the Java validator's own suite, which is deliberate: the two
# implementations exist side by side until the CLI ships, and the examples are
# what holds them in agreement.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # acemq-java-rabbitmq-admin can release without a commit landing here, so the
  # workflow also runs on a timer. That scheduled run is the only thing that will
  # ever notice a library release moving underneath an untouched repository.
  schedule:
    - cron: '53 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        run: |
          for f in scripts/*.sh .github/scripts/*.sh; do
            bash -n "$f" && echo "  ok $f"
          done

      - name: Shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          # SC2317 fires on the command functions, which are reached through the
          # case dispatch at the bottom and which shellcheck cannot see is a
          # dispatch. SC1090/SC1091 are about sourced paths, which these do not do.
          shellcheck --severity=warning --exclude=SC2317 scripts/*.sh .github/scripts/*.sh

      - name: Executable bits
        # A script committed without +x is one that everybody runs as
        # `bash scripts/...` forever, and the README says `./scripts/...`.
        run: |
          fail=0
          for f in scripts/blue-green-lab.sh scripts/lint-deployment.py; do
            [ -x "$f" ] || { echo "::error::$f is not executable"; fail=1; }
          done
          exit $fail

  build:
    name: build on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The same three as acemq-java-amqp and acemq-java-rabbitmq-admin. 17 is
        # the minimum toolchain and the bytecode target -- this is an
        # application rather than a library, so there is no Boot 2.7 consumer to
        # hold it back (docs/shape.md) -- and 21 and 25 are what estates run.
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # The whole reactor: acemq-infra-core, acemq-infra-rabbitmq,
      # acemq-infra-execute and acemq-infra-cli. `verify` rather than `test`,
      # because the tests against real brokers are the *IT half of the split the
      # parent pom sets up, and those are the ones that find the bugs no amount
      # of reading a management API's documentation would -- a federation
      # endpoint answering 400 rather than 404, a monitoring-only account that
      # made the whole probe throw, and an HTTP/2 upgrade that fails on the first
      # request with a body and takes the announcement step with it.
      #
      # acemq-infra-execute's is the expensive one and it is the point of phase
      # two: two RabbitMQ containers on a shared network, a cutover, and then the
      # rollback derived from it, with the guards waiting out their real settle
      # windows. Two and a half minutes, and worth every second of it -- a
      # rollback nobody has run is a rollback nobody should trust.
      #
      # They need a Docker daemon, which ubuntu-latest has; Testcontainers finds
      # it without configuration, and a runner where it could not would fail
      # rather than skip, which is the point of the step after this one.
      - name: Build and test
        run: mvn -B --no-transfer-progress clean verify

      # The CLI has to be runnable to be a CLI. This catches the two ways the
      # jar can be built wrongly and the test suite cannot see: a missing
      # Main-Class and a classpath that does not name the dependencies.
      - name: The packaged CLI runs
        run: java -jar acemq-infra-cli/target/acemq-infra-cli-*.jar --version

      - name: Check nothing skipped
        # A skip reads as success. The other repositories in this family each
        # grew this guard after something had been quietly not running for
        # weeks; installing it on the first commit that has tests is cheaper
        # than installing it after the same thing happens here.
        #
        # Reads Surefire's XML rather than its "Tests run: ..., Skipped: S"
        # line, because the summary counts skips without naming them and a
        # number nobody can act on is a gate people switch off.
        run: python3 etc/check-nothing-skipped.py .

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7

  examples:
    name: configuration format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Every example validates
        run: ./scripts/lint-deployment.py examples/*.yaml

      - name: Every rejected example is rejected
        # Asserted one file at a time so a single one silently starting to pass
        # cannot hide behind another that still fails.
        run: |
          fail=0
          for f in examples/rejected/*.yaml; do
            if ./scripts/lint-deployment.py "$f" > /dev/null 2>&1; then
              echo "::error::$f was accepted. It is deliberately wrong -- a rule"
              echo "::error::in scripts/lint-deployment.py has stopped firing."
              fail=1
            else
              echo "  ok $f is rejected, as intended"
            fi
          done
          exit $fail

  docs:
    name: docs render and link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      # The build script carries both checks -- source-side over docs/*.md and
      # rendered link-and-anchor over site/*.html -- and fails on either. Running
      # it on every pull request means a broken link is caught before merge
      # rather than by the deploy workflow after it.
      - name: Render and check
        run: bash .github/scripts/build-docs-site.sh

  tracks-the-release:
    name: the pin is the newest release
    runs-on: ubuntu-latest
    # A job of its own rather than a step inside `build`, deliberately. A stale
    # pin and a broken build are different findings and both are worth having:
    # the reactor still compiles and the tests still run whatever this job
    # concludes, so a red X here reads as "the pinned library is old", never as
    # "we have no idea whether any of this works".
    #
    # The examples repositories have had this job for a while. Repositories that
    # *consume* a library had nothing, which is the worse gap of the two: an
    # examples repository pinned old proves something about a version nobody
    # installs any more, whereas a consumer builds the stale library into what it
    # ships. The provider module probes real brokers through this client, so a pin
    # left behind means the probe is tested against management-API behaviour the
    # current release no longer has.
    steps:
      - uses: actions/checkout@v4

      - name: The pinned library is the newest released one
        # Hard failure rather than a warning, for the reason the examples
        # repositories give: a warning in a log is what lets a pin drift for
        # releases at a time, and a green build is read as an answer.
        #
        # The tags are asked of the library repository rather than of the Maven
        # feed: git ls-remote needs no token, which matters on a scheduled run,
        # and the tag is what the release was cut from.
        run: |
          pinned=$(sed -n 's/.*<acemq\.admin\.version>\(.*\)<\/acemq\.admin\.version>.*/\1/p' pom.xml | head -1)
          newest=$(git ls-remote --tags https://github.com/AceMQ-Company/acemq-java-rabbitmq-admin \
                     | grep -v '\^{}' | sed 's#.*refs/tags/##' \
                     | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' \
                     | sort -V | tail -1)

          # An empty answer means the listing failed or the tag naming changed,
          # and comparing against nothing would pass silently forever.
          if [ -z "$newest" ]; then
            echo "::error::no release tags found on acemq-java-rabbitmq-admin, so the pin could not be checked"
            exit 1
          fi
          if [ -z "$pinned" ]; then
            echo "::error::no <acemq.admin.version> found in pom.xml, so the pin could not be checked"
            exit 1
          fi

          if [ "$pinned" != "$newest" ]; then
            echo "::error::pom.xml pins acemq-java-rabbitmq-admin $pinned but the newest release is $newest. Edit <acemq.admin.version> in pom.xml and set it to $newest, then build the reactor against it."
            exit 1
          fi
          echo "pinned acemq-java-rabbitmq-admin $pinned, which is the newest release"
